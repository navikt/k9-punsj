version: 2
registries:
  k9-punsj:
    type: maven-repository
    url: https://maven.pkg.github.com/navikt/k9-punsj
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.*"
    open-pull-requests-limit: 15
    registries:
      - k9-punsj
    groups:
      spring:
        patterns:
          - "spring*"
          - "org.spring*"
      maven:
        patterns:
          - "*"
        exclude-patterns:
          - "no.nav*"
          - "*k9*"
          - "spring*"
          - "org.spring*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/"
    cooldown:
      #setter cooldown til 0 siden denne bare finner avhengigheter fra teamets egne bygg
      default-days: 0
    schedule:
      interval: daily
